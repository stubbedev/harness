basePath: /v1
definitions:
  catalog.Model:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      id:
        type: string
      name:
        type: string
      options:
        $ref: '#/definitions/catalog.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      release_date:
        type: string
      supports_attachments:
        type: boolean
    type: object
  catalog.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  config.ExitBanner:
    enum:
    - default
    - compact
    - none
    type: string
    x-enum-varnames:
    - ExitBannerDefault
    - ExitBannerCompact
    - ExitBannerNone
  config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      name:
        description: Friendly display name shown in the TUI. Falls back to Command
          when empty.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  config.LSPs:
    additionalProperties:
      $ref: '#/definitions/config.LSPConfig'
    type: object
  config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Harness picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      sessionless:
        description: |-
          Sessionless marks a server that does not maintain an MCP session (it
          never issues a Mcp-Session-Id). When true, Harness omits the
          tools/prompts/resources list-changed handlers: the go-sdk opens a
          SEP-2575 "subscriptions/listen" stream whenever any of those handlers
          is set, and sessionless streamable-HTTP servers answer that POST
          with 404 ("session not found"), which the SDK treats as fatal. The
          cost is no live list-changed notifications from this server.

          Set it explicitly on servers that behave this way.
        type: boolean
      timeout:
        type: integer
      tool_search:
        description: |-
          ToolSearch defer-loads this server's tools behind a search tool
          instead of expanding every tool schema into the model's context.
          nil means the default, which is to defer; false opts the server
          back into eager loading. See DeferToolSearch.
        type: boolean
      type:
        $ref: '#/definitions/config.MCPType'
      url:
        type: string
    type: object
  config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  config.MCPs:
    additionalProperties:
      $ref: '#/definitions/config.MCPConfig'
    type: object
  config.MemoryOptions:
    properties:
      enabled:
        type: boolean
      index_budget:
        description: |-
          IndexBudget bounds the character size of the memory index injected
          into the system prompt.
        type: integer
      max_memories:
        description: |-
          MaxMemories caps how many memories are kept. When exceeded, the
          least-used unpinned memories are reaped.
        type: integer
    type: object
  config.SelectedModel:
    properties:
      frequency_penalty:
        type: number
      max_tokens:
        description: Overrides the default model configuration.
        type: integer
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      presence_penalty:
        type: number
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
      provider_options:
        additionalProperties: {}
        description: Override provider specific options.
        type: object
      reasoning_effort:
        description: Only used by models that use the openai provider and need this
          set.
        type: string
      temperature:
        type: number
      think:
        description: Used by anthropic models that can reason to indicate if the model
          should think.
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  config.SelectedModelType:
    enum:
    - large
    - small
    type: string
    x-enum-varnames:
    - SelectedModelTypeLarge
    - SelectedModelTypeSmall
  config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/config.Completions'
      dialog_placement:
        type: string
      diff_mode:
        type: string
      exit_banner:
        $ref: '#/definitions/config.ExitBanner'
      git_status:
        type: boolean
      keybinds:
        additionalProperties:
          items:
            type: string
          type: array
        description: |-
          Keybinds rebinds TUI keys. Keys are stable action names (e.g.
          "editor.send_message"); values are one key or a list of keys. Overrides
          merge over the built-in defaults: only the listed actions change.
        type: object
      mouse:
        type: boolean
      scrollbar:
        type: string
      show_thinking:
        type: boolean
      textarea_min_height:
        type: integer
      theme:
        type: string
      transparent:
        type: boolean
    type: object
  csync.Map-string-config_ProviderConfig:
    type: object
  github_com_stubbedev_harness_internal_config.Config:
    properties:
      $schema:
        type: string
      env:
        additionalProperties:
          type: string
        description: Env is a map of environment variables set on startup.
        type: object
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/config.HookConfig'
          type: array
        type: object
      large_configured:
        allOf:
        - $ref: '#/definitions/config.SelectedModel'
        description: LargeConfigured is the models.large value before fallback.
      large_fallback:
        description: |-
          LargeFallback is true when models.large was set but did not resolve
          against the catalog. Interactive TUI still uses the default; harness
          run refuses to start unless -m / --model overrides.
        type: boolean
      lsp:
        $ref: '#/definitions/config.LSPs'
      mcp:
        $ref: '#/definitions/config.MCPs'
      models:
        additionalProperties:
          $ref: '#/definitions/config.SelectedModel'
        description: We currently only support large/small as values here.
        type: object
      options:
        $ref: '#/definitions/github_com_stubbedev_harness_internal_config.Options'
      providers:
        allOf:
        - $ref: '#/definitions/csync.Map-string-config_ProviderConfig'
        description: The providers that are configured
      reasoning_efforts:
        additionalProperties:
          type: string
        description: |-
          ReasoningEfforts remembers manual reasoning effort choices per
          model, keyed by "provider/model", so switching models and back
          restores each model's own effort instead of leaking the current
          one. Stored in the data directory config.
        type: object
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/config.SelectedModel'
          type: array
        description: Recently used models stored in the data directory config.
        type: object
      verification:
        $ref: '#/definitions/verification.VerificationConfig'
    type: object
  github_com_stubbedev_harness_internal_config.Options:
    properties:
      auto_lsp:
        type: boolean
      auto_summarize_buffer:
        description: |-
          AutoSummarizeBuffer is the number of tokens kept free in a context
          window above 200k tokens before the session is summarized. Zero keeps
          the default of 20000.
        type: integer
      auto_summarize_ratio:
        description: |-
          AutoSummarizeRatio is the share of a context window of up to 200k
          tokens that is kept free before the session is summarized. Zero keeps
          the default of 0.2.
        type: number
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Harness keeps per-workspace machine-owned
          state such as the SQLite database, logs and workspace overrides.
          It defaults to a per-workspace directory under the global data
          root, so nothing harness-owned is written inside the project.
          Relative paths are resolved against the working directory;
          absolute paths are used verbatim. After defaulting the stored
          value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_auto_summarize:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disable_provider_auto_update:
        type: boolean
      disable_update_check:
        type: boolean
      disabled_extensions:
        items:
          type: string
        type: array
      disabled_skills:
        items:
          type: string
        type: array
      disabled_subagents:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      extensions_paths:
        items:
          type: string
        type: array
      global_context_paths:
        items:
          type: string
        type: array
      initialize_as:
        type: string
      max_concurrent_subagents:
        description: |-
          MaxConcurrentSubagents bounds how many dispatched sub-agents run at
          once. Dispatches beyond the limit wait for a slot instead of failing.
        type: integer
      max_retries:
        type: integer
      memory:
        $ref: '#/definitions/config.MemoryOptions'
      notifications:
        type: string
      progress:
        type: boolean
      request_timeout:
        type: integer
      skills_paths:
        items:
          type: string
        type: array
      subagents_paths:
        items:
          type: string
        type: array
      tui:
        $ref: '#/definitions/config.TUIOptions'
    type: object
  github_com_stubbedev_harness_internal_config.Scope:
