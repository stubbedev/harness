# yaml-language-server: $schema=./schema.json
hooks:
  PreToolUse:
    # Safety net against runaway tool-call floods: deny a tool after too
    # many calls of it within a short window (60 calls / 60s by default;
    # override with HARNESS_SPAM_GUARD_MAX / HARNESS_SPAM_GUARD_WINDOW).
    - command: ./scripts/tool-spam-guard.sh
      timeout: 10
lsp:
  gopls:
    options:
      gofumpt: true
      codelenses:
        gc_details: true
        generate: true
        run_govulncheck: true
        test: true
        tidy: true
        upgrade_dependency: true
      hints:
        assignVariableTypes: true
        compositeLiteralFields: true
        compositeLiteralTypes: true
        constantValues: true
        functionTypeParameters: true
        parameterNames: true
        rangeVariableTypes: true
      analyses:
        nilness: true
        unusedparams: true
        unusedvariable: true
        unusedwrite: true
        useany: true
      staticcheck: true
      directoryFilters:
        - "-.git"
        - "-node_modules"
      semanticTokens: true
