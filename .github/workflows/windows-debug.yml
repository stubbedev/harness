name: windows-debug

on:
  push:
    branches: [ci/windows-tools-crash]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tools-verbose-race
            command: go test -count=1 -v -race ./internal/agent/tools
          - name: tools-verbose-norace
            command: go test -count=1 -v ./internal/agent/tools
          - name: tools-shell-only
            command: go test -count=1 -v -run "TestShellTool|TestPty" ./internal/agent/tools
          - name: term
            command: go test -count=1 -v ./internal/term
    runs-on: windows-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run
        run: ${{ matrix.command }}
        env:
          GOTOOLCHAIN: local
