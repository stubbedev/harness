name: Flake

on:
  push:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'nix/**', '**/*.go']
  pull_request:
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'nix/**', '**/*.go']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
          token: ${{ secrets.XILO_TOKEN }}

      # Recompute the Go module vendorHash from go.mod/go.sum. Setting it to a
      # fake value makes `nix build` fail and report the correct one, which we
      # then write back. Idempotent: a current hash converges to no change.
      - name: Recompute vendorHash
        run: |
          FAKE="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CUR="$(grep -oP 'vendorHash = "\K[^"]+' nix/package.nix)"
          sed -i "s#vendorHash = \"${CUR}\"#vendorHash = \"${FAKE}\"#" nix/package.nix
          GOT="$(nix build .#default --no-link 2>&1 | grep -oP 'got:\s+\K(sha256-\S+)' | head -1 || true)"
          [ -z "$GOT" ] && GOT="$CUR"
          sed -i "s#vendorHash = \"${FAKE}\"#vendorHash = \"${GOT}\"#" nix/package.nix
          echo "vendorHash = ${GOT}"

      - name: Build check
        run: nix build .#default --no-link

      - name: Commit updated vendorHash
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet nix/package.nix; then
            echo "vendorHash already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix
          git commit -m "chore(nix): update vendorHash [skip ci]"
          # just release-* can push the same vendorHash commit to main
          # while this job runs. Both commits carry the same content, so
          # rebasing onto theirs drops ours as empty and both sides
          # converge instead of one push being rejected.
          for _ in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "could not push the vendorHash after 5 attempts" >&2
          exit 1
