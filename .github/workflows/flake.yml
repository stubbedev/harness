name: Flake

on:
  push:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'package.nix', '**/*.go']
  pull_request:
    paths: ['go.mod', 'go.sum', 'flake.nix', 'flake.lock', 'package.nix', '**/*.go']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    env:
      XILO_TOKEN: ${{ secrets.XILO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # Set up the self-hosted xilo cache at nix.stubbe.dev so consumers can
      # substitute this build instead of rebuilding:
      #   nix.settings.substituters = [ "https://nix.stubbe.dev/c/default/default" ];
      # Skipped on PRs from forks, where the secret is unavailable.
      - uses: stubbedev/xilo@v1
        if: ${{ env.XILO_TOKEN != '' }}
        with:
          url: https://nix.stubbe.dev
          cache: default
          token: ${{ secrets.XILO_TOKEN }}

      # Recompute the Go module vendorHash from go.mod/go.sum. Setting it to a
      # fake value makes `nix build` fail and report the correct one, which we
      # then write back. Idempotent: a current hash converges to no change.
      - name: Recompute vendorHash
        run: |
          FAKE="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CUR="$(grep -oP 'vendorHash = "\K[^"]+' package.nix)"
          sed -i "s#vendorHash = \"${CUR}\"#vendorHash = \"${FAKE}\"#" package.nix
          GOT="$(nix build .#default --no-link 2>&1 | grep -oP 'got:\s+\K(sha256-\S+)' | head -1 || true)"
          [ -z "$GOT" ] && GOT="$CUR"
          sed -i "s#vendorHash = \"${FAKE}\"#vendorHash = \"${GOT}\"#" package.nix
          echo "vendorHash = ${GOT}"

      - name: Build check
        run: nix build .#default --no-link --print-out-paths | tee /tmp/outpaths

      - name: Push to xilo cache
        if: ${{ env.XILO_TOKEN != '' }}
        # Best-effort: a cache-push failure must not redden the workflow.
        continue-on-error: true
        run: xilo push default $(cat /tmp/outpaths)

      - name: Commit updated vendorHash
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet package.nix; then
            echo "vendorHash already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.nix
          git commit -m "chore(nix): update vendorHash [skip ci]"
          # just release-* can push the same vendorHash commit to main
          # while this job runs. Both commits carry the same content, so
          # rebasing onto theirs drops ours as empty and both sides
          # converge instead of one push being rejected.
          for _ in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "could not push the vendorHash after 5 attempts" >&2
          exit 1
