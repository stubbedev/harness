name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --path-mode=abs --config=.golangci.yml --timeout=8m

      - name: Log messages start with a capital
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check_log_capitalization.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -failfast ./...

      # The config is the app's primary interface, and the schema is generated
      # from the same structs the loader uses. A stale schema.json silently
      # breaks editor completion for every user, so treat drift as a failure.
      - name: Schema is current
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . schema > /tmp/schema.json
          diff -u schema.json /tmp/schema.json

      # The swagger docs are generated from handler annotations; drift means
      # the published API description no longer matches the server.
      # sqlc output is committed; a query or migration edited without
      # regenerating leaves the Go code executing the old SQL.
      - name: sqlc is current
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code internal/db internal/memory/memdb

      # Code that neither the binary nor any test reaches. Test-only
      # seams are fine; a function nothing calls is drift waiting to
      # mislead the next reader.
      - name: No dead code
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./...)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Swagger is current
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --generalInfo main.go --dir . --output internal/swagger --packageName swagger --parseDependency --parseInternal --parseDepth 5
          git diff --exit-code internal/swagger
