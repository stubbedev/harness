version: "2"
linters:
  enable:
    - modernize
    - bodyclose
    # - exhaustive
    # - goconst
    # - godot
    # - godox
    # - gomoddirectives
    - goprintffuncname
    # - gosec
    - misspell
    # - nakedret
    # - nestif
    - nilerr
    - noctx
    - nolintlint
    # - prealloc
    # - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    # - unconvert
    - unparam
    - whitespace
    # - wrapcheck
  disable:
    - errcheck
    - ineffassign
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Test helpers take parameters for readability at the call site even
      # when every current caller passes the same value.
      - path: _test\.go
        linters:
          - unparam
      # A tool reports failures to the model as an error response with a
      # nil Go error; that is the tool contract, not a swallowed error.
      - linters:
          - nilerr
        source: "NewTextErrorResponse|failureResponse"
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - path: internal/shell/run.go
        text: "SA1019.*interp.ExecHandler"
        linters:
          - staticcheck
      - path: internal/agent/tools/mcp/init.go
        text: "SA1019.*LoggingMessageHandler"
        linters:
          - staticcheck
      # SA4023 false positive: RemoveConfigField returns non-nil errors.
      - path: internal/cmd/logout.go
        text: "SA4023"
        linters:
          - staticcheck
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    # - goimports
  exclusions:
    generated: lax
